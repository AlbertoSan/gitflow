name: CI

on:
  pull_request:
    branches:
      - develop
      - 'release/*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js (o Java, Python…)
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      - run: npm install
      - run: npm test